services:
  notenregal:
    image: cabi24/notenregal:latest
    # Or build locally:
    # build: .
    container_name: notenregal
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - DATA_PATH=/data
      - LIBRARY_PATH=/library
      # Optional: set the password up front instead of on first visit (min. 8 characters)
      # - NOTENREGAL_PASSWORD=change-me
    volumes:
      # Persistent data (auth, sessions, shelves, annotations, favorites)
      - notenregal-data:/data
      # Your sheet music library - change this path to your music folder
      - ${LIBRARY_PATH:-./library}:/library
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/auth/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  notenregal-data:
